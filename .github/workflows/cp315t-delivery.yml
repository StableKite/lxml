name: CPython 3.15t ordinary dependency delivery
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinary-pip-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.15t
      - name: Ordinary pip from default branch
        working-directory: ${{ runner.temp }}
        run: python -m pip install "lxml @ git+https://github.com/StableKite/lxml.git"
      - name: Original test extras and static checking tools
        run: python -m pip install cssselect html5lib beautifulsoup4 lxml_html_clean setuptools types-setuptools pyright ruff
      - name: Strict Pyright and lint of build adapters
        run: |
          python -m pyright --project pyrightconfig.delivery.json
          python -m ruff check --isolated --select F,E9 _binary_wheel_backend.py _windows_build_backend.py
      - name: All original tests against installed native wheel
        run: python .github/scripts/original_suite.py .
      - name: Actual native XML APIs, callbacks and eight OS threads
        run: python .github/scripts/cp315t_native_contract.py
      - run: python -m pip check
